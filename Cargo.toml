[package]
name = "uu-remote-linux"
version = "0.1.3"
edition = "2021"
authors = ["uu-remote-linux contributors"]
description = "Unofficial Linux host for NetEase UU Remote: control a Linux desktop from the official clients"
readme = "README.md"
license = "GPL-3.0-or-later"
repository = "https://github.com/VallierDev/uu-remote-linux"

# The executable keeps its established name (deploy scripts, systemd units, docs).
[[bin]]
name = "uuremote-server"
path = "src/main.rs"

[features]
default = []
wayland = []
portal = []

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
flate2 = "1.0"
bytes = "1"
webrtc = "0.10"
libc = "0.2"
nix = { version = "0.29", features = ["term", "process", "fs", "ioctl", "signal"] }
log = "0.4"
qrcode = { version = "0.14", default-features = false }
env_logger = "0.11"
ffmpeg-next = { version = "6.1", default-features = false, features = ["codec", "format", "device", "software-scaling", "software-resampling"] }

[build-dependencies]
cc = "1.0"

[patch.crates-io]
webrtc-dtls = { path = "vendor/webrtc-dtls" }
