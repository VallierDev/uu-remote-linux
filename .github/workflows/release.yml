name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # Built on 22.04 so the binary also runs on Ubuntu 22.04/24.04 and newer Debian (glibc >= 2.35).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libx11-dev libxext-dev libxtst-dev libxfixes-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - name: Package
        run: |
          name=uu-remote-linux-${GITHUB_REF_NAME}-x86_64-linux
          mkdir -p "$name"
          cp target/release/uuremote-server LICENSE README.md README.en.md config.example.json "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: |
            uu-remote-linux-*.tar.gz
            uu-remote-linux-*.tar.gz.sha256
